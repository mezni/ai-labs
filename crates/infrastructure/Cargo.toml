[package]
name = "bio-com-infrastructure"
version = "0.1.0"
edition = "2024"

[dependencies]
bio-com-domain = { path = "../domain" }
bio-com-application = { path = "../application" }

serde = { version = "1", features = ["derive"] }
config = "0.15"
dotenvy = "0.15"
thiserror = "2"

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

sqlx = {
    version = "0.8",
    default-features = false,
    features = [
        "runtime-tokio-rustls",
        "postgres",
        "uuid",
        "chrono",
        "migrate",
        "macros"
    ]
}