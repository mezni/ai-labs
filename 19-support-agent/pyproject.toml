[project]
name = "support-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.0",
]

[project.scripts]
support-agent = "support_agent:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
